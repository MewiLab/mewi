# Two modes:
#   Local dev:  `make dev`  → starts Redis here, app runs natively
#   Deploy test: `make docker-up` → builds image + runs everything
name: mewi

services:

  redis:
    image: redis:7-alpine
    container_name: mewi_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mewi_agent_runtime:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mewi_agent_runtime
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env 
    depends_on:
      redis:
        condition: service_healthy
volumes:
  redis_data: