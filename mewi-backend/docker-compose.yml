# Two modes:
#   Local dev:        `make dev`          -> Redis here, app runs natively
#   Local graph dev:  `make dev-graph`    -> Redis + Neo4j here, app runs natively
#   Docker core:      `make docker-up-core` -> app + Redis in Docker
#   Docker full:      `make docker-up`    -> app + Redis + Neo4j in Docker
name: mewi

services:

  redis:
    image: redis:7-alpine
    container_name: mewi_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: mewi_neo4j
    restart: unless-stopped
    profiles:
      - graph-memory
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      MEMORY_NEO4J_PASSWORD: ${MEMORY_NEO4J_PASSWORD:-mewi-neo4j-dev}
      NEO4J_AUTH: neo4j/${MEMORY_NEO4J_PASSWORD:-mewi-neo4j-dev}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${MEMORY_NEO4J_PASSWORD}\" 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 10

  mewi_agent_runtime:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mewi_agent_runtime
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env 
    environment:
      MEWI_REPORT_ROOT: /mewi-report
      MEMORY_GRAPH_ENABLED: ${MEMORY_GRAPH_ENABLED:-false}
      MEMORY_NEO4J_URL: ${MEMORY_NEO4J_URL:-}
      MEMORY_NEO4J_USERNAME: ${MEMORY_NEO4J_USERNAME:-neo4j}
      MEMORY_NEO4J_PASSWORD: ${MEMORY_NEO4J_PASSWORD:-}
      MEMORY_PGVECTOR_DSN: ${MEMORY_PGVECTOR_DSN:-}
    volumes:
      - ../mewi-report:/mewi-report
    depends_on:
      redis:
        condition: service_healthy
volumes:
  redis_data:
  neo4j_data:
  neo4j_logs:
